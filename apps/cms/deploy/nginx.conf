# NEWEDGE — nginx-Konfiguration (Same-Origin-Setup)
# ------------------------------------------------------------------
# Eine Domain für alles: statische Website + CMS-Pfade auf Strapi +
# Formular-Pfade auf den Lead-Service. Spiegelt das Dev-Proxy-Mapping aus
# vite.config.ts der Website.
#
# NUR für Server, auf denen nginx Port 80/443 auch wirklich bekommt. Hält dort
# bereits Caddy die Ports (z. B. vor einem produktiven Mattermost), gilt
# stattdessen deploy/Caddyfile.newedge + deploy/CADDY-KOEXISTENZ.md — nginx
# könnte die Ports nicht binden und certbot würde mit Caddys ACME-Verwaltung
# kollidieren. Beide Dateien bilden DASSELBE Routing ab: wer eine ändert,
# ändert die andere mit.
# Dateiname MUSS zu deploy/setup.sh passen (dort: newedge.conf). Zwei Kopien
# derselben Config in sites-enabled/ lassen nginx mit „duplicate upstream strapi"
# gar nicht erst starten:
#   cp nginx.conf /etc/nginx/sites-available/newedge.conf
#   ln -sf ../sites-available/newedge.conf /etc/nginx/sites-enabled/newedge.conf
#   nginx -t && systemctl reload nginx
# TLS danach via: certbot --nginx -d newedgebrand.com -d www.newedgebrand.com
#
# Pfad-Aufteilung (kollisionsfrei geprüft, keine Präfixe nötig):
#   /contact, /roi-report, /abmelden/<token>   → Lead-Service  :8090
#   /api, /uploads, /admin, …, /_health        → Strapi        :1337
#   alles andere                               → dist/ (SPA-Fallback)
# Strapis Healthcheck heißt /_health (mit Unterstrich), der des Lead-Service
# /health — beide kollidieren nicht. Die SPA-Routen sind deutsch (/kontakt,
# /roi-rechner), belegen also keinen der Service-Pfade.
# ------------------------------------------------------------------

# Strapi-Upstream (docker-compose bindet an 127.0.0.1:1337)
upstream strapi {
    server 127.0.0.1:1337;
}

# Lead-Service: Kontaktformular + ROI-Report + Abmeldeseite.
# Läuft im SELBEN docker-compose wie Strapi (../docker-compose.yml,
# Service "lead-api") und bindet an 127.0.0.1:8090.
upstream leadservice {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name newedgebrand.com www.newedgebrand.com;

    # ── Statische Website (Vite-Build) ──────────────────────────────
    root /var/www/newedgebrand/dist;
    index index.html;

    # Upload-Limit für CMS-Medien (Media Library). Gilt als Default für alle
    # Locations; die Lead-Endpunkte setzen es unten bewusst wieder herunter.
    client_max_body_size 64m;

    # ── /assets/ — zwei sehr verschiedene Sorten Dateien ────────────────
    # `^~` heißt: dieser Präfix gewinnt, ohne dass nginx noch die Regex-Blöcke
    # weiter unten durchgeht. Aktuell trifft dort ohnehin keiner — aber wenn der
    # Strapi-Block je eine Alternative dazubekommt, die versehentlich auch auf
    # /assets/… passt, würden sonst still alle Bundles ans CMS geproxied.
    location ^~ /assets/ {
        try_files $uri =404;

        # Vite-Bundles heißen name-<hash>.js/.css — bei jeder Änderung ändert
        # sich der Dateiname. Die dürfen ewig im Cache liegen.
        expires 1y;
        add_header Cache-Control "public, immutable";

        # ABER: in dist/assets/ liegen auch ~160 Dateien aus public/assets/ mit
        # FESTEM Namen (Bilder, Videos, Logos). „immutable" auf einem festen
        # Namen bedeutet: ein ausgetauschtes Bild erreicht wiederkehrende
        # Besucher ein Jahr lang nicht — auch nicht per Reload. Für diese Typen
        # deshalb kürzer und revalidierbar.
        # `expires` muss hier stehen — sonst erbt der Block die 1y von oben.
        # Das add_header ersetzt (nicht ergänzt) das des Elternblocks, „immutable"
        # kommt hier also nicht mehr an; max-age liefert `expires` selbst.
        location ~* ^/assets/.+\.(png|jpe?g|gif|webp|avif|svg|ico|mp4|webm)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # SPA-Fallback: alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Formulare → Lead-Service ────────────────────────────────────
    # Same-Origin: die Website ruft /contact und /roi-report auf derselben
    # Domain auf (VITE_API_URL=https://newedgebrand.com) → kein CORS nötig.
    # Diese Blöcke stehen VOR dem Strapi-Block: nginx nimmt bei Regex-Locations
    # den ersten Treffer in Dateireihenfolge.
    location ~ ^/(contact|roi-report)$ {
        # Nur JSON rein — der PDF-Report geht als Mail-Anhang RAUS, nicht rein.
        # Bewusst weit unter den 64m des CMS: kleinere Angriffsfläche.
        client_max_body_size 1m;

        proxy_pass http://leadservice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Das Rate-Limit im Service liest X-Forwarded-For — ohne diesen Header
        # sähe er nur die nginx-IP und würde alle Besucher als einen zählen.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # PDF-Erzeugung + SMTP-Versand
    }

    # ── Abmeldelink aus Follow-up-Mails (DSGVO) → Lead-Service ──────
    # MUSS hier stehen: ohne diesen Block greift der SPA-Fallback und der
    # Abmeldelink liefert index.html statt der Abmeldeseite. Der Pfad ist in
    # bereits versendeten Mails festgeschrieben (FOLLOWUP_UNSUBSCRIBE_BASE) —
    # er darf sich nie wieder ändern.
    location ~ ^/abmelden/ {
        client_max_body_size 1m;

        proxy_pass http://leadservice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Einmal-Token: nichts zwischenspeichern (Proxies, Browser, PWA-Cache)
        add_header Cache-Control "no-store" always;
    }

    # ── Health des Lead-Service — absichtlich NICHT öffentlich ──────
    # /health verrät Betriebsinterna (SMTP an/aus, CMS-Kopplung, Anzahl offener
    # und verwaister Follow-ups). Exakte Location (=) schlägt jede Regex, der
    # Pfad kann also nie versehentlich woanders landen.
    # Für externes Uptime-Monitoring: `allow <monitor-ip>;` ergänzen.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;

        proxy_pass http://leadservice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── CMS-Pfade → Strapi (identisch zum Vite-Dev-Proxy) ───────────
    location ~ ^/(api|uploads|upload|admin|content-manager|content-type-builder|users-permissions|i18n|_health) {
        proxy_pass http://strapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Optional: Admin-Panel zusätzlich absichern (IP-Allowlist o. Basic-Auth).
    # location /admin {
    #     allow 203.0.113.10;   # Büro-IP
    #     deny all;
    #     proxy_pass http://strapi;
    #     ... (Header wie oben)
    # }
}
