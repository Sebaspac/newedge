<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88" fill="none">
<title>New Edge transparent asset</title>
<desc>Transparent-background generated New Edge asset.</desc>
<style>
  .purple{stroke:#6D28D9;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#A855F7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .fill-purple{fill:#6D28D9}.fill-accent{fill:#A855F7}.fill-light{fill:#F3E8FF}.ink{stroke:#3A3A3A;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .ui{fill:white;stroke:#6D28D9;stroke-width:2.2;filter:url(#soft)}
  .label{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:700;fill:#6D28D9}
  .small{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:600;fill:#3A3A3A;opacity:.72}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes dash{to{stroke-dashoffset:-60}}
  .pulse{transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  .flow{stroke-dasharray:8 8;animation:dash 3s linear infinite}
  
</style>
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6D28D9" flood-opacity="0.12"/></filter>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6D28D9"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
</defs>
<rect class="purple" x="17" y="20" width="54" height="38" rx="12"/><path class="purple" d="M32 58l-10 12V56"/><circle class="fill-purple" cx="34" cy="39" r="3"/><circle class="fill-purple" cx="45" cy="39" r="3"/><circle class="fill-purple" cx="56" cy="39" r="3"/>
</svg>