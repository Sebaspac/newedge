    <!-- Consent Mode v2 — Default VOR Cookiebot (offizielle Reihenfolge):
         Standard ist Ablehnung, gilt auch für alles, was später über den
         GTM-Container nachgeladen wird. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
    </script>

    <!-- Cookiebot — Banner + Consent-Verwaltung -->
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="196aa51d-737c-49f4-abdb-fee88db82562" data-blockingmode="auto" type="text/javascript"></script>

    <!-- Google Tag Manager & GA4 — Consent-Gate (DSGVO/TTDSG)
         Consent kommt von Cookiebot. Vor der Einwilligung geht KEINE Anfrage
         an Google. Rückkehrer mit gespeicherter Einwilligung werden direkt
         beim ersten apply() bedient (uc.js lädt synchron davor), Neubesucher
         über die Cookiebot-Events nach dem Banner-Klick.
         Zuordnung: Cookiebot "statistics" → analytics_storage,
         Cookiebot "marketing" → ad_storage/ad_user_data/ad_personalization. -->
    <script>
      (function () {
        var GTM_ID = 'GTM-5LPQ2DT7';
        var GA_ID = 'G-9JCE208Q8L';
        var injected = false;

        function injectGoogle() {
          if (injected) return;
          injected = true;
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var gtm = document.createElement('script');
          gtm.async = true;
          gtm.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
          document.head.appendChild(gtm);

          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(ga);
          gtag('js', new Date());
          gtag('config', GA_ID);
        }

        function apply() {
          var c = window.Cookiebot && window.Cookiebot.consent;
          if (!c) return;
          gtag('consent', 'update', {
            ad_storage: c.marketing ? 'granted' : 'denied',
            ad_user_data: c.marketing ? 'granted' : 'denied',
            ad_personalization: c.marketing ? 'granted' : 'denied',
            analytics_storage: c.statistics ? 'granted' : 'denied'
          });
          if (c.statistics || c.marketing) injectGoogle();
        }

        apply();
        window.addEventListener('CookiebotOnConsentReady', apply);
        window.addEventListener('CookiebotOnAccept', apply);
      })();
    </script>
